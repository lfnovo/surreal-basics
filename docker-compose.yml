# Local/CI SurrealDB for the integration test suite, across supported servers.
#
# surreal-basics targets the surrealdb 2.x SDK, which supports SurrealDB servers
# v2.0.0 through v3.x. We test against both a 2.x and a 3.x server.
#
# The test suite starts/stops the right service automatically (see
# tests/conftest.py); it picks the version from SBL_TEST_SURREAL_VERSION
# (default "v2"). You can also drive it by hand:
#
#   docker compose up -d --wait surrealdb-v2    # v2 on localhost:8000
#   docker compose up -d --wait surrealdb-v3    # v3 on localhost:8001
#   docker compose down -v
#
# Credentials are root/root for both.
services:
  surrealdb-v2:
    image: surrealdb/surrealdb:v2
    command: start --user root --pass root --bind 0.0.0.0:8000
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 3s
      timeout: 3s
      retries: 20

  surrealdb-v3:
    image: surrealdb/surrealdb:v3
    command: start --user root --pass root --bind 0.0.0.0:8000
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 3s
      timeout: 3s
      retries: 20
